---
rustdesk__go_arch_map:
  i386: 'i386'
  x86_64: 'amd64'
  aarch64: 'arm64v8'
  armv7l: 'armv7'
  armv6l: 'armv7'
  armv5l: 'armv7'

rustdesk__arch: >-
  {{ rustdesk__go_arch_map[ansible_facts['architecture']]
     | default(ansible_facts['architecture']) }}
rustdesk__dl_filename: "rustdesk-server-{{ ansible_facts['system'] }}-{{ rustdesk__arch }}"
rustdesk__dl_url: "https://github.com/rustdesk/rustdesk-server/releases/download/{{ rustdesk__version_target }}/{{ rustdesk__dl_filename }}.zip"

# versionscheck
playbook_version_number: 6
playbook_version_path: 'role_l3d.rustdesk.version'
